name: Pull request tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Disposable CI credentials only. No repository secrets or local .env required.
env:
  MYSQL_DATABASE: brightbuy_ci
  MYSQL_USER: brightbuy_ci
  MYSQL_PASSWORD: ci_app_password
  MYSQL_ROOT_PASSWORD: ci_root_password
  JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
  COMPOSE_FILE: compose.yaml:compose.m3-test.yaml

jobs:
  workspace-tests:
    name: Workspace tests and checkout MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build test image
        run: docker compose build api
      - name: Start disposable MySQL
        run: docker compose up -d --wait --wait-timeout 300 m3-test-db
      - name: Run all workspace tests with checkout MySQL enabled
        run: >-
          docker compose run --rm --no-deps
          -e M3_TEST_MYSQL_URL=mysql://root:m3_test_only_password@m3-test-db:3306
          api npm test
      - name: Build client
        run: docker compose run --rm --no-deps api npm run build
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 m3-test-db
      - name: Remove disposable database
        if: always()
        run: docker compose rm --stop --force m3-test-db

  locations-mysql:
    name: MySQL - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: locations-migration
            flag: LOCATIONS_TEST_MYSQL
            file: server/test/locations-migration.test.js
          - suite: locations-api
            flag: LOCATIONS_API_TEST_MYSQL
            file: server/test/locations-api.test.js
          - suite: delivery-days
            flag: DELIVERY_DAYS_TEST_MYSQL
            file: server/test/delivery-days.test.js
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build test image
        run: docker compose build api
      - name: Start disposable MySQL
        run: docker compose up -d --wait --wait-timeout 300 m3-test-db
      # Each matrix job has its own runner and empty database. These suites
      # explicitly reject an existing schema and must not share one.
      - name: Create empty locations test database
        run: >-
          docker compose exec -T
          -e MYSQL_PWD=m3_test_only_password
          m3-test-db mysql -uroot
          -e 'CREATE DATABASE brightbuy_locations_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;'
      - name: Run opted-in MySQL suite
        env:
          TEST_FLAG: ${{ matrix.flag }}
          TEST_FILE: ${{ matrix.file }}
        run: |
          docker compose run --rm --no-deps \
            -e "$TEST_FLAG=1" \
            -e MYSQL_TEST_HOST=m3-test-db \
            -e MYSQL_TEST_PORT=3306 \
            -e MYSQL_TEST_USER=root \
            -e MYSQL_TEST_PASSWORD=m3_test_only_password \
            -e MYSQL_TEST_DATABASE=brightbuy_locations_test_ci \
            api node --test "$TEST_FILE"
      - name: Database logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 m3-test-db
      - name: Remove disposable database
        if: always()
        run: docker compose rm --stop --force m3-test-db

  required-tests:
    name: Required tests
    if: always()
    needs: [workspace-tests, locations-mysql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        env:
          WORKSPACE_RESULT: ${{ needs.workspace-tests.result }}
          LOCATIONS_RESULT: ${{ needs.locations-mysql.result }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$LOCATIONS_RESULT" = success
